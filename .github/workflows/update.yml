name: Update ranking

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 00:05-06:05 UTC = 09:05-15:05 JST.
    - cron: "5 0-6 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ranker.py
      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Update ranking"
          git push
