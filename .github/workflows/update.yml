name: Update ranking

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Runs shortly after each hourly observation in JST.
    - cron: "5 0-2 * * 1-5"
    - cron: "35 3-6 * * 1-5"

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ranker.py
      - name: Announce qualified paper-trade candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python announce.py
      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/alert.json
          git diff --cached --quiet || git commit -m "Update ranking"
          git push
