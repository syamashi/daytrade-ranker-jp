name: Optimize and simulate

on:
  workflow_dispatch:
  schedule:
    # 17:00 JST on weekdays, after the cash market closes.
    - cron: "0 8 * * 1-5"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python optimize.py
      - name: Commit simulation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/simulation.json docs/simulation.html
          git diff --cached --quiet || git commit -m "Update simulation"
          git push
